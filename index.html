<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vinicius Giroto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-1: #AC573D;
      --color-2: #F19E93;

      --light-color: oklch(93.62% 0.008 83.61);
      --accent-color: oklch(81.16% 0.125 83.61);
      --dark-color: oklch(34.5% 0.060 188.08);

      --light-text-color: oklch(0% 0 0 / 85%);
      --dark-text-color: oklch(100% 0 0 / 85%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gabarito", sans-serif;
      background-color: var(--dark-color);
      color: var(--dark-text-color);
      display: grid;

      position: absolute;
      inset: 0;

      grid-template: "aboutme projects" / 5fr 2fr;

      @media (max-aspect-ratio: 1) {
        grid-template: "aboutme" "projects";
      }
    }

    h1,
    h2,
    h3 {
      padding-bottom: 1em;
    }

    p {
      padding-bottom: 1em;
      text-indent: 1em;
    }

    h3::after,
    h2::after {
      content: "";
      display: block;
      width: 3rem;
      height: 0.25rem;
      border-radius: .125rem;
      background-color: var(--accent-color);

      transition: width .5s ease-in-out;
    }

    figure {
      display: grid;
      align-content: center;

      main & {
        aspect-ratio: 1;

        svg {
          width: 16rem;
        }
      }

      aside & {
        aspect-ratio: 16 / 9;

        svg {
          justify-self: center;
          width: 80%;
          height: 100%;
        }
      }
    }

    main {
      display: flex;
      flex-direction: row;
      place-self: center;
      gap: 2rem;
      grid-area: aboutme;

      @media (max-aspect-ratio: 1) {
        flex-direction: column;
      }

      display: flex;
      gap: 2rem;
    }

    aside {
      background-color: oklch(0 0 0 / 0.1);

      display: flex;
      flex-direction: column;
      gap: 2rem;
      grid-area: projects;

      display: flex;
      gap: 2rem;

      padding: 2rem 10%;

      overflow: auto;
    }

    .stroke {
      text-decoration: line-through;
    }

    a {
      text-decoration: none;
      color: inherit;

      &:hover h2::after {
        width: 6rem;
      }
    }
  </style>
</head>

<body>
  <main>
    <figure>
      <svg viewBox="-2 -2 260 260" width="258" height="258">
        <mask id="mask">
          <rect x="0" y="0" width="256" height="256" stroke="none" fill="black" />
          <path d="M 128 0 Q 0 0 0 128 T 128 256 T 256 128 T 128 0 Z" stroke="none" fill="white" />
        </mask>

        <mask id="mask-rect">
          <rect x="0" y="0" width="256" height="144" stroke="none" fill="black" />
          <rect x="0" y="0" rx="16" width="256" height="144" stroke="none" fill="white" />
        </mask>

        <image href="./images/me_in_yellow.webp" width="256" height="256" mask="url(#mask)" />
        <path d="M 128 0 Q 0 0 0 128 T 128 256 T 256 128 T 128 0 Z" stroke="var(--accent-color)" stroke-width="4"
          stroke-dasharray="10 7 100 8 10" stroke-linecap="round" fill="none" />
      </svg>
    </figure>
    <div>
      <h1>Vinicius Giroto</h1>
      <h2>About me</h2>
      <p class="stroke">I am not a web dev.</p>
      <p>Am I a web dev?</p>
    </div>
  </main>
  <aside>
    <h1>Tools & Websites</h1>
    <a href="https://proc.giroto.dev">
      <article>
        <h2>Assembly IDE & CPU Emulator</h2>
        <figure>
          <svg viewBox="-2 -2 260 148" width="258" height="146">
            <image href="./images/proc.webp" width="256" height="144" mask="url(#mask-rect)" />
            <rect x="0" y="0" rx="16" width="256" height="144" stroke="var(--accent-color)" stroke-width="4"
              stroke-dasharray="10 7 100 8 10" stroke-linecap="round" fill="none" />
          </svg>
        </figure>
      </article>
    </a>
    <a href="https://ifsc.usp.br/lio2a/">
      <article>
        <h2>LIO²A Website</h2>
        <figure>
          <svg viewBox="-2 -2 260 148" width="258" height="146">
            <image href="./images/lio2a.webp" width="256" height="144" mask="url(#mask-rect)" />
            <rect x="0" y="0" rx="16" width="256" height="144" stroke="var(--accent-color)" stroke-width="4"
              stroke-dasharray="100 10 7 100 8 10" stroke-linecap="round" fill="none" />
          </svg>
        </figure>
      </article>
    </a>
  </aside>
</body>

</html>
